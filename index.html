<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>헤이리 테니스 코트</title>
<meta name="theme-color" content="#2e7d4f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root{
  --bg:#f4f6f1; --surface:#fff; --ink:#1d2a22; --muted:#566559; --line:#dfe5dc;
  --brand:#2e7d4f; --brand-ink:#fff; --brand-soft:#e3f1e8;
  --res:#dff1e5; --res-ink:#1c5a35;
  --rain:#e4e9f2; --rain-ink:#4b5a78;
  --joint:#fbefc9; --joint-ink:#7a5a00;
  --monthly:#ece3f6; --monthly-ink:#5b3a85;
  --blocked:#f9dcdc; --blocked-ink:#8a2b2b;
  --club:#fde6cf; --club-ink:#8a4a0d;
  --warn:#8a5a00; --err:#b3261e; --radius:12px;
  --shadow:0 1px 2px rgba(20,40,30,.08),0 4px 14px rgba(20,40,30,.06);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121a15; --surface:#1b261f; --ink:#e8efe9; --muted:#9bad9f; --line:#2c3b31;
    --brand:#58b97d; --brand-ink:#0d2015; --brand-soft:#21382a;
    --res:#1f3a2a; --res-ink:#9fe0b6; --rain:#262f40; --rain-ink:#a9b8d6;
    --joint:#3d3414; --joint-ink:#f0d27a; --monthly:#32284a; --monthly-ink:#d1b8f2;
    --blocked:#44201f; --blocked-ink:#f2a5a5; --club:#4a2e16; --club-ink:#f5c690; --warn:#e8b755; --err:#ff8a80;
    --shadow:none;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 "Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;-webkit-text-size-adjust:100%;padding-bottom:calc(72px + env(safe-area-inset-bottom))}
button,select,input,textarea{font:inherit;color:inherit}
header.top{position:sticky;top:0;z-index:20;background:var(--brand);color:var(--brand-ink);padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top))}
.top .row{display:flex;align-items:center;gap:10px;max-width:1040px;margin:0 auto}
.top h1{font-size:17px;margin:0;flex:1;font-weight:700;letter-spacing:-.01em}
.top .row2{margin-top:8px;flex-wrap:wrap}
.top select{background:rgba(255,255,255,.18);color:inherit;border:1px solid rgba(255,255,255,.35);border-radius:8px;padding:5px 8px}
.top select option{color:#111}
.ibtn{background:rgba(255,255,255,.16);border:0;color:inherit;border-radius:10px;min-width:44px;height:44px;font-size:18px;cursor:pointer;position:relative}
.ibtn .dot{position:absolute;top:4px;right:4px;background:#ffd23f;color:#222;border-radius:9px;font-size:11px;min-width:18px;height:18px;line-height:18px;font-weight:700}
.switch{display:flex;align-items:center;gap:6px;font-size:14px;cursor:pointer}
.switch input{width:36px;height:20px;accent-color:#ffd23f}
main{max-width:1040px;margin:0 auto;padding:16px}
nav#tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:20}
nav#tabs .in{display:flex;width:100%;max-width:1040px}
nav#tabs button{flex:1;border:0;background:none;padding:8px 2px 7px;color:var(--muted);font-size:12.5px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;min-height:56px}
nav#tabs button .ic{font-size:20px;line-height:1.2}
nav#tabs button[aria-current="page"]{color:var(--brand);font-weight:700}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);margin-bottom:14px}
.card h2{margin:0 0 10px;font-size:16px}
h2.sec{font-size:15px;margin:18px 0 8px;color:var(--muted);font-weight:600}
.muted{color:var(--muted)} .small{font-size:14px}
a.btn{text-decoration:none;display:inline-flex;align-items:center;color:inherit}
.btn{border:1px solid var(--muted);background:var(--surface);border-radius:10px;padding:8px 14px;cursor:pointer;min-height:44px}
.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);font-weight:600}
.btn.danger{color:var(--err);border-color:var(--err)}
.btn.sm{padding:6px 12px;min-height:44px;font-size:14px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btns .grow{flex:1}
.toolbar{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.toolbar h2{margin:0;font-size:18px;flex:1;min-width:120px}
input[type=date],input[type=text],input[type=number],input[type=month],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:44px;max-width:100%;font-size:16px}
textarea{width:100%}
.banner{background:var(--brand-soft);border:1px solid var(--line);border-radius:var(--radius);padding:10px 14px;margin-bottom:14px}
.banner b{color:var(--brand)}
/* month */
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.mgrid .dow{text-align:center;font-size:12px;color:var(--muted);padding:2px 0}
.mday{min-height:72px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px 5px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:2px;overflow:hidden}
.mday.out{background:transparent;border-style:dashed;opacity:.5}
.mday.today{outline:2px solid var(--brand)}
.mday .n{font-size:13px;font-weight:600}
.mday.sun .n{color:#c0392b}.mday.sat .n{color:#2d6cc0}
.chip{font-size:12px;line-height:1.35;border-radius:6px;padding:0 5px;display:inline-block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.c-res{background:var(--res);color:var(--res-ink)}.c-rain{background:var(--rain);color:var(--rain-ink)}
.c-joint{background:var(--joint);color:var(--joint-ink)}.c-monthly{background:var(--monthly);color:var(--monthly-ink)}
.c-blocked{background:var(--blocked);color:var(--blocked-ink)}.c-club{background:var(--club);color:var(--club-ink)}.c-gray{background:var(--line);color:var(--muted)}
.legend{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 0}
/* day grid */
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.grid{border-collapse:separate;border-spacing:3px;width:100%;min-width:560px}
table.grid th{font-size:12px;color:var(--muted);font-weight:600;padding:2px}
table.grid th.hr{width:62px;text-align:right;padding-right:6px}
table.grid td{height:44px;border-radius:8px;background:var(--surface);border:1px dashed var(--line);text-align:center;font-size:13px;padding:0 3px;cursor:pointer;word-break:keep-all}
table.grid td.hr{border:0;background:none;color:var(--muted);text-align:right;padding-right:6px;font-size:12px;cursor:default}
table.grid td.res{background:var(--res);color:var(--res-ink);border:1px solid transparent;font-weight:600}
table.grid td.rainc{background:var(--rain);color:var(--rain-ink);border:1px solid transparent;text-decoration:line-through}
table.grid td.joint{background:var(--joint);color:var(--joint-ink);border:1px solid transparent}
table.grid td.monthly{background:var(--monthly);color:var(--monthly-ink);border:1px solid transparent}
table.grid td.club{background:var(--club);color:var(--club-ink);border:1px solid transparent}
table.grid td.blocked{background:var(--blocked);color:var(--blocked-ink);border:1px solid transparent}
table.grid td.senior{background:repeating-linear-gradient(45deg,var(--line),var(--line) 6px,transparent 6px,transparent 12px);cursor:default;color:var(--muted);font-size:11px}
table.grid td.empty:hover{border-color:var(--brand);background:var(--brand-soft)}
/* lists */
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);flex-wrap:wrap}
.item .grow{flex:1;min-width:150px}
.item .t{font-weight:600}
.badge{font-size:12px;border-radius:999px;padding:1px 9px;display:inline-block}
table.tbl{width:100%;border-collapse:collapse;font-size:14px}
table.tbl th,table.tbl td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:top}
table.tbl th{font-size:12px;color:var(--muted);font-weight:600}
table.tbl td:nth-child(2){white-space:nowrap}
table.tbl td.num,table.tbl th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.tbl tfoot td{font-weight:700;border-bottom:0}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chips .chip{font-size:12px;padding:1px 7px}
pre.notice{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;font:inherit;font-size:14px;margin:0}
/* dialog */
dialog{border:0;border-radius:16px;padding:18px;max-width:min(520px,calc(100vw - 24px));width:100%;background:var(--surface);color:var(--ink);box-shadow:0 10px 40px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(10,20,14,.5)}
dialog h2{margin:0 0 12px;font-size:18px}
.form{display:grid;grid-template-columns:96px 1fr;gap:8px 10px;align-items:center}
.form label{font-size:14px;color:var(--muted)}
.form .full{grid-column:1/-1}
.msg{font-size:13px;border-radius:8px;padding:6px 10px;margin-top:6px}
.msg.err{background:var(--blocked);color:var(--blocked-ink)}.msg.warn{background:var(--joint);color:var(--joint-ink)}.msg.ok{background:var(--res);color:var(--res-ink)}
#toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#1d2a22;color:#fff;padding:10px 16px;border-radius:12px;z-index:50;max-width:calc(100vw - 32px);font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
.empty-note{color:var(--muted);text-align:center;padding:18px 8px;font-size:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:12px}
.kpi{background:var(--bg);border-radius:10px;padding:8px 12px}.kpi b{display:block;font-size:20px}
@media (max-width:560px){
  main{padding:12px}
  .mday{min-height:58px;padding:3px}
  .mday .chip{font-size:11px;padding:0 3px}
  .form{grid-template-columns:1fr}
}

table.sheet th.ctr,table.sheet td.ctr{text-align:center;white-space:nowrap}
table.sheet{min-width:640px}table.sheet th[scope=row]{white-space:nowrap;background:var(--bg)}
table.sheet .sc{margin:2px 0}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* 접근성 */
:focus-visible{outline:3px solid #ffb300;outline-offset:2px;border-radius:6px}
.skip{position:absolute;left:8px;top:-60px;background:#fff;color:#000;padding:10px 14px;border-radius:8px;z-index:100;font-weight:700}
.skip:focus{top:8px}
nav#tabs button[aria-current="page"]{border-top:3px solid var(--brand);padding-top:5px}
td[role=button],div[role=button]{touch-action:manipulation}
button,.btn,td[role=button]{touch-action:manipulation}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
@media (forced-colors:active){.chip,.badge{border:1px solid CanvasText}}

/* 로그인 · 역할 표시 */
.badge-admin{background:#ffd23f;color:#3a2e00;border-radius:999px;font-size:11px;font-weight:700;padding:1px 8px;vertical-align:middle}
.top #whoami{font-size:14px}
body.auth nav#tabs,body.auth .ibtn{display:none}
.login{max-width:440px;margin:24px auto}
.seg{display:flex;gap:4px;background:var(--bg);border-radius:10px;padding:3px;margin:8px 0 14px}
.seg button{flex:1;border:0;background:none;border-radius:8px;padding:8px 4px;cursor:pointer;color:var(--muted);font-size:14px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:var(--shadow)}
</style>
</head>
<body>
<a class="skip" href="#main">본문으로 건너뛰기</a>
<header class="top">
  <div class="row">
    <h1>🎾 헤이리 테니스 코트</h1>
    <button class="ibtn" data-act="bell" aria-label="알림 보기">🔔<span class="dot" id="bellDot" hidden></span></button>
    <button class="ibtn" data-act="settings" aria-label="설정">⚙️</button>
  </div>
  <div class="row row2"><span id="whoami"></span></div>
</header>
<main id="main" tabindex="-1"></main>
<nav id="tabs" aria-label="주 메뉴"><div class="in">
  <button data-tab="home"><span class="ic">🏠</span>홈</button>
  <button data-tab="cal"><span class="ic">📅</span>캘린더</button>
  <button data-tab="assign"><span class="ic">📋</span>배정</button>
  <button data-tab="mine"><span class="ic">🙋</span>내 예약</button>
  <button data-tab="settle"><span class="ic">💰</span>정산</button>
  <button data-tab="notice"><span class="ic">📣</span>공지</button>
</div></nav>
<dialog id="dlg"></dialog>
<div id="toast" role="status" aria-live="polite"></div>
<script src="config.js"></script>
<script>
/* ============ 유틸 ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return ymd(d)};
const WD=['일','월','화','수','목','금','토'];
const fmtDate=s=>{const d=parse(s);return `${d.getMonth()+1}/${d.getDate()}(${WD[d.getDay()]})`};
const won=n=>n.toLocaleString('ko-KR')+'원';
const hh=(s,h)=>`${pad(s)}~${pad(s+h)}`;
const today=()=>ymd(new Date());
const lsGet=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};

/* ============ 서버(Supabase) 연결 ============ */
const CFG=window.HEYRI_CONFIG||{};
const SKEY='heyri.session.v1',FKEY='heyri.fired.v1';
const API={
  session:lsGet(SKEY,null),
  async http(url,opts){
    let r;
    try{r=await fetch(url,opts)}catch(e){throw new Error('네트워크에 연결할 수 없어요')}
    const txt=await r.text();let j=null;try{j=txt?JSON.parse(txt):null}catch(e){}
    if(!r.ok){const err=new Error((j&&(j.message||j.msg||j.error_description||j.error))||('오류 '+r.status));err.status=r.status;throw err}
    return j;
  },
  setSession(j){this.session={access_token:j.access_token,refresh_token:j.refresh_token,expires_at:j.expires_at||Math.floor(Date.now()/1000)+(j.expires_in||3600)};lsSet(SKEY,this.session)},
  clear(){this.session=null;lsSet(SKEY,null)},
  async anon(){
    const j=await this.http(CFG.url+'/auth/v1/signup',{method:'POST',headers:{apikey:CFG.key,'Content-Type':'application/json'},body:JSON.stringify({data:{}})});
    this.setSession(j);
  },
  async token(){
    const s=this.session;
    if(!s){await this.anon();this.relogin=true;return this.session.access_token}
    if(s.expires_at-60<Date.now()/1000){
      try{
        const j=await this.http(CFG.url+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:CFG.key,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:s.refresh_token})});
        this.setSession(j);
      }catch(e){this.clear();await this.anon();this.relogin=true}
    }
    return this.session.access_token;
  },
  async rest(method,path,body,prefer){
    for(let n=0;n<2;n++){
      const tok=await this.token();
      try{
        return await this.http(CFG.url+'/rest/v1'+path,{method,headers:{apikey:CFG.key,Authorization:'Bearer '+tok,'Content-Type':'application/json',...(prefer?{Prefer:prefer}:{})},body:body===undefined?undefined:JSON.stringify(body)});
      }catch(e){if(e.status===401&&n===0){this.clear();this.relogin=true;continue}throw e}
    }
  },
  rpc(name,args){return this.rest('POST','/rpc/'+name,args||{})},
  async all(table,q){const out=[];for(let off=0;;off+=1000){const rows=await this.rest('GET',`/${table}?${q}&limit=1000&offset=${off}`);out.push(...rows);if(rows.length<1000)break}return out}
};
function errMsg(e){
  const m=String(e&&e.message||e);
  if(/Anonymous sign-ins are disabled/i.test(m))return '익명 로그인이 꺼져 있어요. Supabase의 Authentication → Sign In / Providers에서 "Allow anonymous sign-ins"를 켜 주세요.';
  if(/row-level security|permission denied/i.test(m))return '권한이 없어요';
  if(/예약관리자만/.test(m))return '예약관리자만 할 수 있어요';
  return m;
}

/* ============ 상태 ============ */
const DEFAULT_SETTINGS={
  courts:6,seniorCourt:1,nightStart:18,alertMin:10,bookLead:6,announcement:'',
  rates:{wd:{day:3000,night:5000},we:{day:3500,night:5500}},
  holidays:['2026-12-25','2027-01-01','2027-03-01','2027-05-05','2027-12-25']
};
let S={mode:'boot',members:[],memberObjs:[],idOf:{},byId:{},reservations:[],blocks:[],assignments:[],rules:[],swaps:[],notes:[],joinReqs:[],
  settings:JSON.parse(JSON.stringify(DEFAULT_SETTINGS)),me:'',meId:null,admin:false,sig:''};
const L={tab:'login',members:[],status:'none',busy:false};
const view={tab:'home',month:today().slice(0,7),day:null,assignDate:addDays(today(),1),settleMonth:today().slice(0,7),noticeDate:addDays(today(),1),allHours:false};
const nameOf=id=>S.byId[id]||'?';

let lastEnsure=0;
async function loadAll(){
  if(Date.now()-lastEnsure>3600000){lastEnsure=Date.now();try{await API.rpc('ensure_assignments',{p_days:70})}catch(e){}}
  const [members,res,blocks,asg,swaps,notes,sett,meId,isAdmin,rules]=await Promise.all([
    API.rest('GET','/members?select=id,name,sort,is_admin&order=sort,id'),
    API.all('reservations','select=*&order=date,start_hour,id'),
    API.all('blocks','select=*&order=date,id'),
    API.all('assignments','select=*&order=date,id'),
    API.rest('GET','/swaps?select=*&order=created_at'),
    API.rest('GET','/notes?select=*&order=created_at.desc&limit=60'),
    API.rest('GET','/club_settings?select=data&id=eq.1'),
    API.rpc('my_member_id'),API.rpc('is_admin'),
    API.rest('GET','/assignment_rules?select=*&order=weekday,start_hour,id').catch(()=>[])
  ]);
  if(!meId)throw Object.assign(new Error('로그인이 필요해요'),{needLogin:true});
  S.memberObjs=members;S.members=members.map(m=>m.name);S.idOf={};S.byId={};
  members.forEach(m=>{S.idOf[m.name]=m.id;S.byId[m.id]=m.name});
  S.meId=meId;S.me=nameOf(meId);S.admin=!!isAdmin;
  S.reservations=res.map(r=>({id:r.id,date:r.date,court:r.court,start:r.start_hour,hours:r.hours,member:nameOf(r.member_id),memberId:r.member_id,status:r.status,cancelledOn:r.cancelled_on||undefined}));
  S.blocks=blocks.map(b=>({id:b.id,date:b.date,court:b.court,start:b.start_hour,hours:b.hours,type:b.type,label:b.label}));
  S.assignments=asg.filter(a=>!a.skipped).map(a=>({id:a.id,date:a.date,member:nameOf(a.member_id),memberId:a.member_id,court:a.court||null,ruleId:a.rule_id||null,start:a.start_hour,hours:a.hours}));
  S.rules=(rules||[]).map(r=>({id:r.id,weekday:r.weekday,member:nameOf(r.member_id),memberId:r.member_id,court:r.court||null,start:r.start_hour,hours:r.hours}));
  S.swaps=swaps.map(s=>({id:s.id,from:nameOf(s.from_member),fromId:s.from_member,to:nameOf(s.to_member),toId:s.to_member,aId:s.a_id,bId:s.b_id,text:s.text,status:s.status}));
  S.notes=notes.map(n=>({id:n.id,toAdmin:n.to_admin,text:n.text,read:n.read,at:Date.parse(n.created_at)}));
  S.settings={...DEFAULT_SETTINGS,...((sett[0]&&sett[0].data)||{})};
  S.joinReqs=S.admin?(await API.rpc('admin_list_join_requests').catch(()=>[])):[];
  S.sig=JSON.stringify([S.reservations,S.blocks,S.assignments,S.rules,S.swaps,S.notes,S.settings,S.memberObjs,S.joinReqs,S.admin]);
}
async function refresh(force){
  if(S.mode!=='app')return;
  const before=S.sig;
  try{await loadAll()}catch(e){
    if(e.needLogin||API.relogin){S.mode='boot';return boot()}

  }

}

/* ============ 요금 / 규칙 ============ */
const isOff=d=>{const w=parse(d).getDay();return w===0||w===6||S.settings.holidays.includes(d)};
const hourRate=(d,h)=>{const t=isOff(d)?S.settings.rates.we:S.settings.rates.wd;return h>=S.settings.nightStart?t.night:t.day};
const fullPrice=r=>{let p=0;for(let i=0;i<r.hours;i++)p+=hourRate(r.date,r.start+i);return p};
const daysBetween=(a,b)=>Math.round((parse(a)-parse(b))/864e5);
function resPrice(r){
  if(r.status==='booked')return fullPrice(r);
  if(r.status==='self_cancel')return daysBetween(r.date,r.cancelledOn||r.date)>=3?0:fullPrice(r);
  return 0;
}
const STATUS={booked:'예약',rain_cancel:'우천 취소',self_cancel:'본인 취소'};
function selfCancelCount(member,year,exceptId){
  return S.reservations.filter(r=>r.member===member&&r.status==='self_cancel'&&r.date.startsWith(year)&&r.id!==exceptId).length;
}
function validateRes(d){
  const err=[],warn=[];
  if(!d.member)err.push('회원을 선택하세요');
  if(!d.date)err.push('날짜를 입력하세요');
  if(d.start+d.hours>22)err.push('이용 시간은 22시까지예요');
  if(d.hours>2)err.push('1인 최대 2시간까지 예약할 수 있어요');
  if(d.status==='booked'&&d.date){
    const act=r=>r.id!==d.id&&r.status==='booked';
    for(const r of S.reservations.filter(r=>act(r)&&r.date===d.date&&r.court===d.court))
      if(d.start<r.start+r.hours&&r.start<d.start+d.hours)err.push(`코트${d.court} ${hh(r.start,r.hours)}시에 이미 ${r.member}님 예약이 있어요`);
    for(const b of S.blocks.filter(b=>b.date===d.date&&b.court===d.court&&b.type!=='rain'))
      if(d.start<b.start+b.hours&&b.start<d.start+d.hours)err.push(`코트${d.court} ${hh(b.start,b.hours)}시는 ${b.label}(으)로 사용 중이에요`);
    if(S.reservations.some(r=>act(r)&&r.date===d.date&&r.member===d.member))
      err.push(`${d.member}님은 이 날 이미 예약이 있어요 (1인 1일 1회, 위반 시 자동 취소)`);
    if(d.date>addDays(today(),S.settings.bookLead||6))warn.push(`협회 사이트는 오늘 기준 ${S.settings.bookLead||6}일 뒤까지만 예약할 수 있어요 (설정에서 바꿀 수 있어요)`);
    if(d.court===S.settings.seniorCourt)warn.push(`코트${d.court}은 시니어 고정 코트예요`);
  }
  if(d.status==='self_cancel'&&d.member&&d.date){
    const c=selfCancelCount(d.member,d.date.slice(0,4),d.id);
    if(c>=6)warn.push(`올해 본인 취소가 이미 ${c}회예요 (천재지변 외 연 6회까지 허용)`);
    else if(c>=4)warn.push(`올해 본인 취소 ${c}회째예요 (연 6회까지)`);
  }
  return {err,warn};
}
function firstFreeCourt(date,start,hours){
  const m=dayMap(date);
  for(let c=1;c<=S.settings.courts;c++){
    if(c===S.settings.seniorCourt)continue;
    let free=true;
    for(let i=0;i<hours;i++){const x=m[c+':'+(start+i)];if(x&&!(x.t==='r'&&x.r.status!=='booked'))free=false}
    if(free)return c;
  }
  return 2;
}

/* ============ 캘린더 데이터 ============ */
function dayMap(date){
  const m={};
  S.blocks.filter(b=>b.date===date).forEach(b=>{for(let i=0;i<b.hours;i++)m[b.court+':'+(b.start+i)]={t:'b',b}});
  S.reservations.filter(r=>r.date===date&&r.status!=='booked').forEach(r=>{for(let i=0;i<r.hours;i++)m[r.court+':'+(r.start+i)]={t:'r',r}});
  S.reservations.filter(r=>r.date===date&&r.status==='booked').forEach(r=>{for(let i=0;i<r.hours;i++)m[r.court+':'+(r.start+i)]={t:'r',r}});
  return m;
}
function daySummary(date){
  const rs=S.reservations.filter(r=>r.date===date),bs=S.blocks.filter(b=>b.date===date);
  return {
    n:rs.filter(r=>r.status==='booked').length,
    rain:rs.filter(r=>r.status==='rain_cancel').length+bs.filter(b=>b.type==='rain').length,
    joint:bs.some(b=>b.type==='joint'),monthly:bs.some(b=>b.type==='monthly'),blocked:bs.some(b=>b.type==='blocked'),club:bs.some(b=>b.type==='club'),
    asg:S.assignments.filter(a=>a.date===date).length
  };
}

function viewDay(date){
  const map=dayMap(date),off=isOff(date);
  let hours=off?[7,8,9,10,11]:[17,18,19,20,21];
  const used=Object.keys(map).map(k=>+k.split(':')[1]);
  if(view.allHours)hours=Array.from({length:16},(_,i)=>i+6);
  else if(used.length){const lo=Math.min(...hours,...used),hi=Math.max(...hours,...used);hours=Array.from({length:hi-lo+1},(_,i)=>lo+i)}
  const C=S.settings.courts;
  let head=`<tr><th class="hr"></th>`+Array.from({length:C},(_,i)=>`<th>코트${i+1}${S.settings.seniorCourt===i+1?'<br><span class="small">시니어</span>':''}</th>`).join('')+`</tr>`;
  let body='';
  for(const h of hours){
    body+=`<tr><td class="hr">${hh(h,1)}</td>`;
    for(let c=1;c<=C;c++){
      const x=map[c+':'+h];
      if(S.settings.seniorCourt===c&&!x){body+=`<td class="senior">시니어 고정</td>`;continue}
      if(!x){body+=`<td class="empty" data-act="cell" data-date="${date}" data-court="${c}" data-hour="${h}"></td>`;continue}
      if(x.t==='b'){const cl={joint:'joint',monthly:'monthly',blocked:'blocked',club:'club',rain:'rainc'}[x.b.type];body+=`<td class="${cl}">${esc(x.b.label)}</td>`;continue}
      const r=x.r;
      if(r.status==='booked')body+=`<td class="res" data-act="edit-res" data-id="${r.id}">${esc(r.member)}</td>`;
      else body+=`<td class="rainc" data-act="edit-res" data-id="${r.id}" title="${STATUS[r.status]}">${esc(r.member)}<br><span class="small">${r.status==='rain_cancel'?'우천':'취소'}</span></td>`;
    }
    body+=`</tr>`;
  }
  const n=daySummary(date).n;
  const extGroups=extGroupsOf(date);
  const extCard=S.admin?`<div class="card"><h2>타 클럽·행사 입력 (예약관리자)</h2>
    ${extGroups.length?`<div class="list">${extGroups.map(g=>`<div class="item"><div class="grow"><span class="badge ${BT_CLS[g.type]}">${BT_NAME[g.type]}</span> <b>${esc(g.label)}</b><br><span class="muted small">코트${g.courts.join('·')} · ${hh(g.start,g.hours)}시</span></div>
      <button class="btn sm danger" data-act="ext-del" data-ids="${g.ids.join(',')}">삭제</button></div>`).join('')}</div>`:'<div class="empty-note">입력된 타 클럽·행사 예약이 없어요</div>'}
    <div class="btns"><button class="btn primary" data-act="ext-open" data-date="${date}">＋ 타 클럽·행사 예약 입력</button></div>
    <p class="muted small">단톡방에 올라온 "예약 현황" 글을 그대로 붙여 넣어도 돼요.</p></div>`:'';
  return `<div class="toolbar"><button class="btn" data-act="back-month">‹ 월</button>
    <button class="btn" data-act="day" data-d="-1" aria-label="전날">‹</button>
    <h2>${fmtDate(date)} ${off?'<span class="badge c-joint">주말·공휴일 요금</span>':''}</h2>
    <button class="btn" data-act="day" data-d="1" aria-label="다음날">›</button></div>
    <div class="card"><div class="scroll"><table class="grid"><thead>${head}</thead><tbody>${body}</tbody></table></div>${legend()}
      <div class="btns"><button class="btn primary" data-act="add-res" data-date="${date}">＋ 예약 결과 입력</button>
      <button class="btn" data-act="toggle-hours">${view.allHours?'기본 시간만':'전체 시간 보기'}</button>
      <button class="btn" data-act="goto-notice" data-date="${date}">📣 공지 문구</button></div>
      <p class="muted small">이 날 회원 예약 ${n}건 · 빈 칸을 누르면 그 시간으로 입력창이 열려요. 휴대폰에서는 표를 옆으로 밀면 나머지 코트가 보여요.</p></div>${extCard}`;
}

/* --- 단톡방용 배정표 (예약잡는날 기준 7칸) --- */
function sheetModel(){
  const L6=lead(),cols=[0,1,2,3,4,5,6].map(b=>({b,play:(b+L6)%7}));
  const keys=[...new Set(S.rules.map(r=>r.start+'|'+r.hours))].map(k=>k.split('|').map(Number))
    .sort((a,b)=>(a[0]>=S.settings.nightStart?0:1)-(b[0]>=S.settings.nightStart?0:1)||a[0]-b[0]||a[1]-b[1]);
  cols.forEach(c=>{
    const rs=S.rules.filter(r=>r.weekday===c.play);
    const courts=[...new Set(rs.map(r=>r.court).filter(Boolean))];
    c.court=courts.length===1?courts[0]:null;
    c.cells=keys.map(([st,h])=>{
      const g={};rs.filter(r=>r.start===st&&r.hours===h).forEach(r=>{(g[r.court||0]=g[r.court||0]||[]).push(r.member)});
      return Object.entries(g).map(([court,names])=>({court:+court||null,names}));
    });
  });
  return {cols,keys};
}
function sheetText(){
  const {cols,keys}=sheetModel(),d=parse(today()),out=[`🎾 헤이리 테니스 클럽 배정표 (${d.getFullYear()}. ${d.getMonth()+1}. ~)`,'※ 같은 칸의 이름이 둘이면 07:00에 함께 시도하고, 성공한 분이 예약해요.'];
  cols.forEach(c=>{
    const lines=[];keys.forEach(([st,h],i)=>c.cells[i].forEach(g=>lines.push(`  • ${hh(st,h)}시${g.court?' 코트'+g.court:''} ${g.names.join(' / ')}`)));
    if(lines.length)out.push('',`■ ${WD[c.b]}요일 07:00 예약 → ${WD[c.play]}요일 운동`,...lines);
  });
  return out.join('\n');
}
function sheetHtml(){
  const {cols,keys}=sheetModel();
  if(!keys.length)return '<div class="empty-note">아직 요일별 배정이 없어요</div>';
  const cellHtml=(g,c)=>g.map(x=>`<div class="sc">${x.court&&x.court!==c.court?`<span class="muted small">코트${x.court}</span> `:''}${x.names.map(esc).join('<br>')}</div>`).join('');
  return `<div class="scroll"><table class="tbl sheet"><caption class="sr-only">예약 요일별 배정표</caption><thead>
    <tr><th scope="col"></th>${cols.map(c=>`<th scope="col" class="ctr">${c.court?`<span class="badge c-res">코트${c.court}</span>`:''}</th>`).join('')}</tr>
    <tr><th scope="row">예약 잡는 날</th>${cols.map(c=>`<th scope="col" class="ctr">${WD[c.b]}요일</th>`).join('')}</tr>
    <tr><th scope="row">운동 하는 날</th>${cols.map(c=>`<th scope="col" class="ctr">${WD[c.play]}요일</th>`).join('')}</tr></thead>
    <tbody>${keys.map(([st,h],i)=>`<tr><th scope="row">${hh(st,h)}시</th>${cols.map(c=>`<td class="ctr">${cellHtml(c.cells[i],c)||'<span class="muted">-</span>'}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}
function sheetCanvas(){
  const {cols,keys}=sheetModel(),sc=2,LW=104,CW=96,PAD=16,TH=46,HH=34;
  const cellLines=(g,c)=>g.flatMap(x=>[...(x.court&&x.court!==c.court?['코트'+x.court]:[]),...x.names]);
  const rowH=keys.map((_,i)=>Math.max(44,Math.max(...cols.map(c=>cellLines(c.cells[i],c).length))*22+16));
  const W=PAD*2+LW+CW*7,Hh=PAD*2+TH+HH*3+rowH.reduce((a,b)=>a+b,0)+40;
  const cv=document.createElement('canvas');cv.width=W*sc;cv.height=Hh*sc;
  const x=cv.getContext('2d');x.scale(sc,sc);x.fillStyle='#fff';x.fillRect(0,0,W,Hh);
  const F='"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans CJK KR",sans-serif';
  const d=parse(today());
  x.fillStyle='#1d2a22';x.font=`700 20px ${F}`;x.textAlign='center';x.textBaseline='middle';
  x.fillText(`헤이리 테니스 클럽 배정표 · ${d.getFullYear()}. ${d.getMonth()+1}. ~`,W/2,PAD+TH/2);
  let y=PAD+TH;const x0=PAD;
  const box=(cx,cy,w,h,fill)=>{x.fillStyle=fill||'#fff';x.fillRect(cx,cy,w,h);x.strokeStyle='#9aa89f';x.lineWidth=1;x.strokeRect(cx+.5,cy+.5,w,h)};
  const txt=(t,cx,cy,w,h,o={})=>{x.fillStyle=o.color||'#1d2a22';x.font=`${o.bold?700:400} ${o.size||14}px ${F}`;x.textAlign='center';x.textBaseline='middle';x.fillText(t,cx+w/2,cy+h/2)};
  const hdr=[['',c=>c.court?'코트'+c.court:'','#e3f1e8'],['예약 잡는 날',c=>WD[c.b]+'요일','#fff6d6'],['운동 하는 날',c=>WD[c.play]+'요일','#e8eefb']];
  hdr.forEach(([lab,f,fill])=>{box(x0,y,LW,HH,'#f1f3ef');txt(lab,x0,y,LW,HH,{bold:1,size:13});
    cols.forEach((c,i)=>{box(x0+LW+i*CW,y,CW,HH,fill);txt(f(c),x0+LW+i*CW,y,CW,HH,{bold:1})});y+=HH});
  keys.forEach(([st,h],r)=>{box(x0,y,LW,rowH[r],'#f1f3ef');txt(hh(st,h)+'시',x0,y,LW,rowH[r],{bold:1,size:13});
    cols.forEach((c,i)=>{box(x0+LW+i*CW,y,CW,rowH[r]);const ls=cellLines(c.cells[r],c),top=y+(rowH[r]-ls.length*22)/2;
      ls.forEach((l,k)=>txt(l,x0+LW+i*CW,top+k*22,CW,22,{color:/^코트/.test(l)?'#566559':'#1d2a22',size:/^코트/.test(l)?12:14}))});y+=rowH[r]});
  x.fillStyle='#566559';x.font=`400 12px ${F}`;x.textAlign='left';x.fillText('※ 같은 칸에 이름이 둘이면 07:00에 함께 시도하고, 성공한 분이 예약해요.',PAD,y+22);
  return cv;
}

  return S.members.map((m,i)=>{const mine=rs.filter(r=>r.member===m);return {i:i+1,name:m,items:mine,total:mine.reduce((s,r)=>s+resPrice(r),0)}});
}

const BT_NAME={club:'타 클럽',joint:'공동 사용',monthly:'월례대회',blocked:'대회·사용불가',rain:'우천'};

function extGroupsOf(date){
  const g={};
  S.blocks.filter(b=>b.date===date&&b.type!=='rain').forEach(b=>{const k=[b.type,b.label,b.start,b.hours].join('|');(g[k]=g[k]||{type:b.type,label:b.label,start:b.start,hours:b.hours,courts:[],ids:[]});g[k].courts.push(b.court);g[k].ids.push(b.id)});
  return Object.values(g).map(x=>({...x,courts:x.courts.sort((a,b)=>a-b)})).sort((a,b)=>a.start-b.start||a.label.localeCompare(b.label));
}
/* 카톡 "예약 현황" 글 → {date, event, courts:[{court,ranges:[[시작,끝]]}]} */
function parseStatus(text){
  const out={date:null,event:null,courts:[]};
  const dm=text.match(/(\d{1,2})\s*월\s*(\d{1,2})\s*일/);
  if(dm){const t=today(),y=+t.slice(0,4);let yy=y;const m=+dm[1];if(m<+t.slice(5,7)-6)yy=y+1;out.date=`${yy}-${pad(m)}-${pad(+dm[2])}`}
  for(const raw of text.split(/\r?\n/)){
    const line=raw.trim();if(!line)continue;
    const cm=line.match(/^(\d)\s*번\s*[:：]\s*(.+)$/);
    if(cm){
      const court=+cm[1],val=cm[2].trim(),ranges=[];
      if(/전\s*시간/.test(val))ranges.push([6,22]);
      else for(const m of val.matchAll(/(\d{1,2})\s*[-~–]\s*(\d{1,2})/g)){const a=+m[1],b=+m[2];if(a>=6&&b<=22&&b>a)ranges.push([a,b])}
      if(ranges.length)out.courts.push({court,ranges});
      continue;
    }
    const em=line.match(/^[•·\-*▪●○]\s*(.+)$/);
    if(em&&!out.event){const label=em[1].replace(/\(?\s*공동\s*사용\s*\)?/,'').trim();out.event={label:label||em[1].trim(),joint:/공동/.test(em[1])}}
  }
  return out;
}
/* 이미 회원 예약·등록된 칸은 빼고, 새로 넣을 칸만 코트별 연속 구간으로 */
function newBlockRows(date,courtRanges,type,label){
  const map=dayMap(date),rows=[];
  for(const {court,ranges} of courtRanges){
    const hs=new Set();ranges.forEach(([a,b])=>{for(let h=a;h<b;h++)hs.add(h)});
    const free=[...hs].filter(h=>{const x=map[court+':'+h];return !(x&&(x.t==='b'||(x.r&&x.r.status==='booked')))}).sort((a,b)=>a-b);
    let st=null,prev=null;
    const flush=()=>{if(st!==null)rows.push({date,court,start_hour:st,hours:prev-st+1,type,label})};
    for(const h of free){if(st===null){st=h}else if(h!==prev+1){flush();st=h}prev=h}
    flush();
  }
  return rows;
}

function noticeText(date){
  const C=S.settings.courts,occ={};
  const add=(c,st,h)=>{(occ[c]=occ[c]||new Set());for(let i=0;i<h;i++)occ[c].add(st+i)};
  const bs=S.blocks.filter(b=>b.date===date&&b.type!=='rain');
  bs.forEach(b=>add(b.court,b.start,b.hours));
  const rs=S.reservations.filter(r=>r.date===date&&r.status==='booked').sort((a,b)=>a.start-b.start||a.court-b.court);
  rs.forEach(r=>add(r.court,r.start,r.hours));
  const sr=S.settings.seniorCourt;if(sr&&!(occ[sr]&&occ[sr].size))add(sr,6,16);
  const rain=S.reservations.filter(r=>r.date===date&&r.status==='rain_cancel');
  const d=parse(date);
  let t=`[ ${d.getMonth()+1}월 ${d.getDate()}일(${WD[d.getDay()]}) 예약 현황 ]\n`;
  [...new Set(bs.filter(x=>x.type!=='club').map(x=>x.label+(x.type==='joint'&&!/공동/.test(x.label)?'(공동사용)':'')))].forEach(e=>{t+=`•  ${e}\n`});
  let any=false;
  for(let c=1;c<=C;c++){
    const set=occ[c];if(!set||!set.size)continue;any=true;
    const hs=[...set].sort((a,b)=>a-b);
    if(hs.length>=16&&hs[0]<=6&&hs[hs.length-1]>=21){t+=`${c}번 : 전시간\n`;continue}
    const rg=[];let st=hs[0],pv=hs[0];
    for(const h of hs.slice(1)){if(h===pv+1){pv=h;continue}rg.push([st,pv+1]);st=h;pv=h}
    rg.push([st,pv+1]);
    t+=`${c}번 : ${rg.map(([a,b])=>`${pad(a)}-${pad(b)}시`).join(',')}\n`;
  }
  if(!any)t+=`예약이 아직 없어요.\n`;
  if(rs.length){t+=`\n[헤이리 클럽 예약]\n`;for(const r of rs)t+=`• ${hh(r.start,r.hours)}시 ${r.court}번 ${r.member}\n`}
  if(rain.length)t+=`\n☔ 우천 취소: ${rain.map(r=>`${r.member}(${r.court}번 ${hh(r.start,r.hours)})`).join(', ')}\n`;
  return t.trim();
}

function copy(t,msg){
  const done=()=>toast(msg);
  if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(t).then(done,()=>fallback());
  else fallback();
  function fallback(){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done()}catch(e){toast('복사하지 못했어요. 직접 선택해 복사해 주세요')}ta.remove()}
}
function exportCsv(){
  const rows=settleRows(view.settleMonth),max=Math.max(1,...rows.map(r=>r.items.length));
  const q=v=>`"${String(v).replace(/"/g,'""')}"`;
  const head=['No','성명',...Array.from({length:max},(_,i)=>`${i+1}차`),'합계'];
  const lines=[head.map(q).join(',')];
  rows.forEach(r=>{const cells=r.items.map(x=>{const p=resPrice(x);return p>0?p:'취소'});while(cells.length<max)cells.push('');lines.push([r.i,r.name,...cells,r.total].map(q).join(','))});
  lines.push(['','Total',...Array(max).fill(''),rows.reduce((s,r)=>s+r.total,0)].map(q).join(','));
  const b=new Blob(['﻿'+lines.join('\n')],{type:'text/csv;charset=utf-8'});
  const u=URL.createObjectURL(b),l=document.createElement('a');l.href=u;l.download=`헤이리코트_정산_${view.settleMonth}.csv`;l.click();setTimeout(()=>URL.revokeObjectURL(u),1000);
}

  if(e.target.id==='asDate'&&e.target.value){view.assignDate=e.target.value;render()}
  if(e.target.id==='stMonth'&&e.target.value){view.settleMonth=e.target.value;render()}
  if(e.target.id==='noDate'&&e.target.value){view.noticeDate=e.target.value;render()}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&S.mode==='login'&&e.target.tagName==='INPUT'){const b=document.querySelector('.login .btn.primary');if(b)b.click()}
});
function applyHash(){const m=location.hash.match(/day=(\d{4}-\d{2}-\d{2})/);if(m){view.tab='cal';view.day=m[1];view.month=m[1].slice(0,7)}}
window.addEventListener('hashchange',()=>{applyHash();if(S.mode==='app')render()});
let pollT=null;
function startPolling(){
  if(pollT)return;
  pollT=setInterval(()=>{if(document.visibilityState==='visible'&&!dlg.open)refresh()},20000);
  setInterval(checkAlerts,15000);
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&!dlg.open)refresh()});
}
async function boot(){
  $('#main').innerHTML='<div class="empty-note">불러오는 중…</div>';
  if(!CFG.url||!CFG.key){$('#main').innerHTML='<div class="card"><h2>설정이 필요해요</h2><p>config.js에 Supabase 주소와 키를 넣어 주세요.</p></div>';return}
  try{
    await API.token();
    const meId=await API.rpc('my_member_id');
    if(!meId){await showLogin();return}
    API.relogin=false;
    await loadAll();
    S.mode='app';document.body.classList.remove('auth');
    applyHash();render();checkAlerts();startPolling();
  }catch(e){
    $('#main').innerHTML=`<div class="card"><h2>서버에 연결하지 못했어요</h2><p class="muted">${esc(errMsg(e))}</p><div class="btns"><button class="btn primary" data-act="retry">다시 시도</button></div></div>`;
  }
}
boot();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});

</script>
</body>
</html>
